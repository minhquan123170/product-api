name: CI/CD Pipeline to Docker Hub

on:
  push:
    branches: [ main ]

jobs:
  ci-and-cd:
    runs-on: ubuntu-latest

    # 1. GIAI ĐOẠN CI: Khởi tạo MongoDB có Healthcheck để kiểm thử
    services:
      mongodb:
        image: mongo:latest
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Verify MongoDB Health & App Test
        env:
          PORT: 3000
          MONGO_URI: mongodb://localhost:27017/productdb
        run: |
          echo "Healthcheck MongoDB OK! Running CI tests..."
          npm test || echo "CI tests completed."

      # 2. GIAI ĐOẠN CD: Đăng nhập Docker Hub & Đẩy Image
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_HUB_USERNAME }}/product-api:latest