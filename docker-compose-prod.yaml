services:
  mongodb:
    image: mongo:latest
    container_name: nammongodb_prod
    ports:
      - "27017:27017"
    volumes:
      - mongo_prod_data:/data/db

  product-api:
    image: quan140305/product-api:latest
    container_name: product_api_prod
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - MONGO_URI=mongodb://mongodb:27017/productdb
    depends_on:
      - mongodb

volumes:
  mongo_prod_data: